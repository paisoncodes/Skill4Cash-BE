version: "3.9"

services:
  skill4cash_db:
    image: postgres:12
    container_name: skill4cash_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5435:5435
    expose:
      - 5434
    command: -p 5435
    restart: always

  skill4cash_cache:
    image: redis:6.2-alpine
    container_name: skill4cash_cache
    restart: always
    volumes:
      - cache:/var/lib/redis/data

  skill4cash_api:
    build: .
    command: sh local-entry.sh
    volumes:
      - .:/app
    ports:
      - "6800:6800"
    expose:
      - 6800
    restart: always

    depends_on:
      - skill4cash_db
      - skill4cash_cache
volumes: 
  postgres_data:
  cache:
    driver: local